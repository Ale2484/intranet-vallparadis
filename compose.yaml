services:
  app:
    # Compose la construye la app desde el Dockerfile local
    image: ${APP_IMAGE:-alebt/vallparadis-app:1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vallparadis-app
    restart: unless-stopped
    environment:
      # Variables mínimas para que Laravel se conecte a MySQL dentro de la red de Docker
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-vallparadis}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-vallparadis}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      RUN_SEEDERS: ${DOCKER_RUN_SEEDERS:-false}
    ports:
      # Expone la app en http://localhost:8080
      - "8080:8000"
    depends_on:
      # Espera a que MySQL funcione antes de arrancar Laravel
      db:
        condition: service_healthy
    volumes:
      # Mantiene persistente el contenido generado dentro de storage
      - storage_data:/var/www/html/storage

  db:
    # Base de datos MySQL usada por la aplicacion
    image: mysql:8.4
    container_name: vallparadis-db
    restart: unless-stopped
    environment:
      # Credenciales y base de datos inicial para MySQL
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-vallparadis}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-vallparadis}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-rootsecret}
    healthcheck:
      # Permite a Compose saber cuando MySQL está listo para aceptar conexiones
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DOCKER_DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  # Persistencia de datos de MySQL
  mysql_data:
  # Persistencia de archivos generados por Laravel
  storage_data:
