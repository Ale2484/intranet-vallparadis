version: '3.8'

services:
  app:
    build:
      context: .              # ← Usa el directorio actual (raíz del proyecto)
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html                    # ← Monta TODO el código
      - laravel_storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=vallparadis
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=secret123
    depends_on:
      - db
    networks:
      - laravel_network

  db:
    image: mysql:8.0
    container_name: laravel_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=vallparadis
      - MYSQL_USER=laravel_user
      - MYSQL_PASSWORD=secret123
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network

volumes:
  mysql_data:
  laravel_storage:

networks:
  laravel_network:
    driver: bridge